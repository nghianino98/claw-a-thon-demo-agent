[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-agent-qa"
version = "0.1.0"
description = "CLI helper for AI Agent interview Q&A and mock interviews"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
interview-agent = "interview_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
